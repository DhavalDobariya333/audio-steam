<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Stream — Recording Archive</title>
    <meta name="description" content="Innocent and secure audio recordings archive and storage portal.">
    <meta name="theme-color" content="#090912">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
</head>
<body>

    <div class="app">

        <!-- Top Header -->
        <header class="header">
            <div class="header__brand">
                <div class="logo-icon">📁</div>
                <div>
                    <!-- Secret 6-tap trigger to open stealth portal -->
                    <h1 class="header__title" id="secret-trigger-header" style="cursor: pointer; user-select: none;" title="Audio Archive">Audio Archive</h1>
                    <div class="header__status" id="server-status">
                        <span class="status-dot status-dot--online"></span>
                        <span id="status-text">Storage Online</span>
                    </div>
                </div>
            </div>

            <div class="view-switch" style="display: flex; gap: 8px; align-items: center;">
                <button class="btn-refresh" id="btn-refresh" title="Refresh list" style="padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer;">🔄 Refresh</button>
                <button id="btn-logout" title="Lock & Logout" style="padding: 8px 16px; border-radius: 8px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500;">🔒 Logout</button>
            </div>
        </header>

        <!-- Stats Chips Bar -->
        <div class="stats-bar" id="stats-bar">
            <div class="stat-card stat-card--accent">
                <span class="stat-card__val" id="stat-sessions">0</span>
                <span class="stat-card__lbl">Total Recordings</span>
            </div>
            <div class="stat-card">
                <span class="stat-card__val" id="stat-chunks">0</span>
                <span class="stat-card__lbl">Total Chunks</span>
            </div>
            <div class="stat-card">
                <span class="stat-card__val" id="stat-duration">00:00</span>
                <span class="stat-card__lbl">Total Duration</span>
            </div>
            <div class="stat-card">
                <span class="stat-card__val" id="stat-storage">0 B</span>
                <span class="stat-card__lbl">Storage Used</span>
            </div>
        </div>

        <!-- Main Content -->
        <main style="margin-top: 16px;">
            <section class="section-card section-card--dashboard" id="sec-dashboard">
                <div class="card-head">
                    <div>
                        <h2 class="card-title">🎙️ Audio Recording Sessions</h2>
                        <div class="card-sub" id="session-count">0 sessions recorded</div>
                    </div>
                </div>

                <div class="filter-box" style="margin-bottom: 16px;">
                    <select id="client-filter" class="select-field select-field--sm">
                        <option value="">All Devices / Clients</option>
                    </select>
                </div>

                <!-- Active Recording Player Box -->
                <div id="inline-player-box" style="display: none; background: rgba(26, 26, 46, 0.85); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div>
                            <div id="player-title" style="font-weight: 600; color: #a78bfa;">Playing Recording</div>
                            <div id="player-meta" style="font-size: 12px; color: var(--text-muted);">—</div>
                        </div>
                        <button id="btn-close-player" style="background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">&times;</button>
                    </div>
                    <audio id="main-audio-player" controls style="width: 100%; border-radius: 8px; outline: none;"></audio>
                </div>

                <div class="session-list-container">
                    <ul class="session-list" id="session-list">
                        <li class="empty-state">Loading recordings...</li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal__icon">🗑️</div>
            <div class="modal__title">Delete Recording Session?</div>
            <div class="modal__desc">This will permanently delete all audio chunks for this recording.</div>
            <div class="modal__id" id="modal-session-id"></div>
            <div class="modal__actions">
                <button class="btn btn--secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn--danger" id="modal-confirm">Delete Permanently</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/app.js"></script>
</body>
</html>
